spring.application.name=payment-service

spring.config.import=sm://
spring.cloud.gcp.secretmanager.project-id=gcloud-website-deploy

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# HikariCP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

#PostgreSQL Database
spring.datasource.url=${sm://projects/gcloud-website-deploy/secrets/SUPABASE_DB_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${sm://projects/gcloud-website-deploy/secrets/SUPABASE_DB_USER}
spring.datasource.password=${sm://projects/gcloud-website-deploy/secrets/SUPABASE_DB_PASSWORD}

# Server
server.port=${PORT:8080}

server.forward-headers-strategy=framework

app.openapi.title=Payment Service API
app.openapi.description=REST API for managing Payment Information
app.openapi.version=1.0.0

razorpay.key.id=${sm://projects/gcloud-website-deploy/secrets/RAZORPAY_KEY}
razorpay.key.secret=${sm://projects/gcloud-website-deploy/secrets/RAZORPAY_PASSWORD}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,https://medicareplus-970647939758.us-central1.run.app}